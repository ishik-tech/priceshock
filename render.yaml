services:
  - type: web
    name: priceshock-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python init_db.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./priceshock.db
      - key: CORS_ORIGINS
        sync: false
      - key: ENVIRONMENT
        value: production

  - type: web
    name: priceshock-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start -- -p $PORT
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
