[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "RUF"]
ignore = [
    # FastAPI's dependency-injection pattern is `param: T = Depends(...)`,
    # which is the framework's documented, idiomatic usage - not a bug.
    "B008",
    # SQLite stores naive datetimes; every column in app/models is a plain
    # DateTime compared against datetime.now(). Using timezone-aware
    # datetimes here would raise "can't compare offset-naive and
    # offset-aware datetimes" against values read back from the DB.
    "DTZ005",
]

[tool.mypy]
ignore_missing_imports = true
